<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EEF6FB"><title>오늘의 에오르제아 · FFXIV Companion</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#dashboard" class="brand"><img src="/icon.svg" alt=""><span>오늘의 에오르제아<small>FFXIV COMPANION</small></span></a>
    <nav aria-label="메인 메뉴">
      <button data-page="dashboard"><span aria-hidden="true">◫</span> 오늘 할 일</button>
      <button data-page="contents"><span aria-hidden="true">▤</span> 전체 콘텐츠</button>
      <button data-page="history"><span aria-hidden="true">◷</span> 완료 기록</button>
      <button data-page="settings"><span aria-hidden="true">⚙</span> 반복과 설정</button>
    </nav>
    <div class="side-bottom"><div class="local-badge"><i></i> 내 PC에 저장</div><p>내 속도로, 가볍게.<br>오늘 하고 싶은 것만.</p></div>
  </aside>
  <main>
    <header class="topbar"><span id="date-label"></span><div><span id="save-status" role="status">연결 중</span><button class="primary" id="add-task">＋ 콘텐츠 추가</button></div></header>
    <div id="screen" aria-live="polite"></div>
  </main>
  <dialog id="editor"><form id="task-form">
    <div class="dialog-heading"><div><span class="eyebrow">MY CONTENT</span><h2 id="editor-title">새 콘텐츠</h2></div><button type="button" class="icon-button" data-close aria-label="창 닫기">×</button></div>
    <p class="muted">이름만 적어도 충분해요. 나머지는 필요할 때.</p>
    <label>이름 <span class="required">필수</span><input name="name" required maxlength="120" placeholder="예: 무작위 임무: 숙련자" autocomplete="off"></label>
    <div class="form-grid"><label>진행 방식<select name="type"><option value="check">완료 체크</option><option value="counter">수량 채우기</option><option value="checklist">여러 항목 체크</option></select></label><label>반복<select name="ruleId"></select></label></div>
    <div id="counter-fields" class="form-grid" hidden><label>현재 수량<input name="current" type="number" min="0" max="1000000000" step="1" placeholder="0"></label><label>목표 수량<input name="target" type="number" min="1" max="1000000000" step="1" placeholder="1"></label></div>
    <div id="checklist-fields" hidden><label>세부 항목</label><p class="field-hint">레이드별 동전, 목표 달성 단계 등을 하나씩 적어요.</p><div id="step-editor"></div><button type="button" id="add-step" class="soft">＋ 항목 추가</button></div>
    <details id="extra-fields"><summary>더 설정하기 <span>종류 · 메모 · 링크</span></summary>
      <label>목표 종류<input name="category" list="categories" maxlength="40" placeholder="기타"><datalist id="categories"><option>일일</option><option>주간</option><option>재화</option><option>레이드</option><option>레벨링</option><option>무기</option><option>탈것</option><option>룩템</option></datalist></label>
      <label>메모<textarea name="notes" rows="3" maxlength="5000" placeholder="기억해 둘 내용만 적어 주세요"></textarea></label>
      <label>관련 링크<input name="url" type="url" maxlength="2000" placeholder="https://"></label>
      <label class="inline-check"><input name="pinned" type="checkbox"> 맨 위에 고정</label>
    </details>
    <p class="form-error" id="task-error" role="alert"></p>
    <footer><button type="button" class="ghost" data-close>취소</button><button type="submit" class="primary">저장하기</button></footer>
  </form></dialog>
  <dialog id="detail" class="detail-dialog"><div id="detail-content"></div></dialog>
  <dialog id="rule-editor"><form id="rule-form">
    <div class="dialog-heading"><div><span class="eyebrow">RESET SCHEDULE</span><h2 id="rule-title">반복 규칙 추가</h2></div><button type="button" class="icon-button" data-close aria-label="창 닫기">×</button></div>
    <p class="muted">모든 시간은 한국 시간 기준이에요.</p>
    <label>규칙 이름<input name="name" required maxlength="120" placeholder="예: 금요일 저녁 숙제"></label>
    <div class="form-grid"><label>주기<select name="kind"><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option><option value="interval">며칠마다</option></select></label><label>초기화 시간<input name="time" type="time" value="00:00" required></label></div>
    <label id="rule-day" hidden>요일<select name="day"><option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option></select></label>
    <label id="rule-date" hidden>매월 날짜<input name="date" type="number" min="1" max="31" placeholder="1"><span class="field-hint">해당 날짜가 없는 달은 마지막 날에 초기화해요.</span></label>
    <div id="rule-interval" hidden class="form-grid"><label>며칠마다<input name="days" type="number" min="1" max="365" placeholder="2"></label><label>기준 시작일<input name="anchor" type="date"></label></div>
    <p class="field-hint">수정해도 현재 체크는 유지돼요. 새 규칙의 다음 시간부터 초기화해요.</p><p id="rule-error" class="form-error" role="alert"></p>
    <footer><button type="button" class="ghost" data-close>취소</button><button type="submit" class="primary">규칙 저장</button></footer>
  </form></dialog>
  <dialog id="confirm-dialog"><div class="dialog-heading"><h2 id="confirm-title"></h2></div><p id="confirm-message"></p><footer><button class="ghost" id="confirm-no">취소</button><button class="primary" id="confirm-yes">확인</button></footer></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
